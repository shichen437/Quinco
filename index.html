<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quinco</title>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: oklch(1 0 0);
        transition: opacity 400ms ease-out;
      }

      #splash.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      .dark #splash {
        background: oklch(0.145 0 0);
      }

      #splash .splash-logo {
        display: flex;
        gap: 0.02em;
        font-size: clamp(2rem, 6vw, 4rem);
        font-weight: 600;
        letter-spacing: 0.04em;
        font-family: "Inter Variable", system-ui, sans-serif;
        text-transform: uppercase;
        color: transparent;
        -webkit-text-stroke: 1.5px oklch(0.205 0 0);
        background: linear-gradient(90deg, oklch(0.205 0 0) 50%, transparent 50%)
          calc(100% - var(--fill, 0%)) 0 / 200% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        background-repeat: no-repeat;
        animation: splash-fill 2.4s cubic-bezier(0.25, 0.1, 0.25, 1) infinite;
      }

      .dark #splash .splash-logo {
        -webkit-text-stroke: 1.5px oklch(0.75 0 0);
        background: linear-gradient(90deg, oklch(0.922 0 0) 50%, transparent 50%)
          calc(100% - var(--fill, 0%)) 0 / 200% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        background-repeat: no-repeat;
      }

      @keyframes splash-fill {
        0% {
          --fill: 0%;
        }
        45%,
        55% {
          --fill: 100%;
        }
        100% {
          --fill: 0%;
        }
      }

      @property --fill {
        syntax: "<percentage>";
        inherits: false;
        initial-value: 0%;
      }
    </style>
  </head>

  <body>
    <div id="splash">
      <div class="splash-logo">
        <span class="splash-letter">Q</span>
        <span class="splash-letter">u</span>
        <span class="splash-letter">i</span>
        <span class="splash-letter">n</span>
        <span class="splash-letter">c</span>
        <span class="splash-letter">o</span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
